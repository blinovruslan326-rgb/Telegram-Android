name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK, NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Insert my api_id and api_hash
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          F=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i "s/APP_ID = [0-9]*;/APP_ID = ${TG_API_ID};/" $F
          sed -i "s/APP_HASH = \"[^\"]*\";/APP_HASH = \"${TG_API_HASH}\";/" $F
          grep -n "APP_ID\|APP_HASH" $F | sed 's/"[0-9a-f]\{32\}"/"***"/'

      - name: Change application id
        run: |
          NEWID=com.ruslan.tgmod
          echo "--- APP_PACKAGE before ---"
          grep -rn "APP_PACKAGE" gradle.properties TMessagesProj_App/ --include=*.gradle --include=*.properties | grep -v "/build/" || true
          for f in gradle.properties TMessagesProj_App/gradle.properties; do
            if [ -f "$f" ]; then sed -i "s/^\(APP_PACKAGE *= *\).*/\1${NEWID}/" "$f"; fi
          done
          for f in $(find . -name google-services.json -not -path "*/build/*"); do
            sed -i "s/\"package_name\": *\"org\.telegram\.messenger\"/\"package_name\": \"${NEWID}\"/" "$f"
          done
          echo "--- APP_PACKAGE after ---"
          grep -rn "APP_PACKAGE" gradle.properties TMessagesProj_App/ --include=*.gradle --include=*.properties | grep -v "/build/" || true
          grep -n "package_name" TMessagesProj_App/google-services.json || true
          if ! grep -rq "APP_PACKAGE *= *${NEWID}" gradle.properties TMessagesProj_App/gradle.properties 2>/dev/null; then
            echo "ERROR: APP_PACKAGE was not changed"
            exit 1
          fi

      - name: Apply ghost mode patch
        run: |
          cat > TMessagesProj/src/main/java/org/telegram/messenger/GhostMode.java << 'JAVA'
          package org.telegram.messenger;

          import org.telegram.tgnet.TLObject;
          import org.telegram.tgnet.TLRPC;

          public class GhostMode {
              public static boolean enabled = true;

              public static boolean shouldBlock(TLObject object) {
                  if (!enabled || object == null) {
                      return false;
                  }
                  return object instanceof TLRPC.TL_messages_readHistory
                      || object instanceof TLRPC.TL_channels_readHistory
                      || object instanceof TLRPC.TL_messages_readEncryptedHistory
                      || object instanceof TLRPC.TL_messages_setTyping
                      || object instanceof TLRPC.TL_messages_setEncryptedTyping
                      || object instanceof TLRPC.TL_account_updateStatus;
              }
          }
          JAVA
          python3 - << 'PY'
          import re, sys
          p = "TMessagesProj/src/main/java/org/telegram/tgnet/ConnectionsManager.java"
          s = open(p).read()
          pattern = re.compile(r"public int sendRequest\(([^)]*)\)\s*\{")
          count = 0
          def repl(m):
              global count
              params = m.group(1)
              mm = re.search(r"TLObject\s+(\w+)", params)
              if not mm or "RequestDelegate" not in params:
                  return m.group(0)
              count += 1
              name = mm.group(1)
              return m.group(0) + "\n        if (org.telegram.messenger.GhostMode.shouldBlock(" + name + ")) { return 0; }"
          s = pattern.sub(repl, s)
          if count == 0:
              print("ERROR: sendRequest not found in ConnectionsManager.java")
              for l in s.splitlines():
                  if "sendRequest" in l:
                      print(l)
              sys.exit(1)
          open(p, "w").write(s)
          print("Patched sendRequest overloads:", count)
          PY
          grep -n "GhostMode" TMessagesProj/src/main/java/org/telegram/tgnet/ConnectionsManager.java

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon --stacktrace

      - name: Re-sign APK with my own key
        run: |
          BT=$ANDROID_HOME/build-tools/36.0.0
          APK=$(find TMessagesProj_App/build/outputs/apk -name "*.apk" | head -1)
          echo "Built APK: $APK"
          $BT/aapt2 dump badging "$APK" | grep -E "^package:|sdkVersion|targetSdkVersion|native-code" || true
          keytool -genkeypair -keystore my.jks -alias my -keyalg RSA -keysize 2048 -validity 10000 -storepass mypass123 -keypass mypass123 -dname "CN=tgmod"
          $BT/zipalign -f -p 4 "$APK" aligned.apk
          $BT/apksigner sign --ks my.jks --ks-pass pass:mypass123 --out signed.apk aligned.apk
          $BT/apksigner verify -v signed.apk
          mkdir -p out
          cp signed.apk out/telegram-mod.apk
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-mod-apk
          path: out/telegram-mod.apk
